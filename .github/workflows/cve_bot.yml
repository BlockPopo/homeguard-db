name: 실시간 CVE 데이터 수집 봇

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  update-cve:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 깃허브 코드 강제 연결
        uses: actions/checkout@v4
        with:
          ref: main # main 브랜치를 정확히 타겟팅하여 길을 잃지 않게 함

      - name: 파이썬 세팅하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: requests 설치
        run: pip install requests

      - name: 파이썬 봇 실행
        run: python fetch_cve.py

      - name: 깃허브 강제 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cve_data.json
          git commit -m "🚀 실시간 CVE 데이터 업데이트 완료" || echo "변경사항 없음"
          git pull origin main --rebase
          git push origin main
