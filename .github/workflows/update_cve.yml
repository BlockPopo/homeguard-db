name: Auto Update CVE Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 내 깃허브 코드 가져오기
      uses: actions/checkout@v3

    - name: 2. 파이썬 설치하기
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 필요 패키지(requests) 설치하기
      run: pip install requests

    - name: 4. fetch_cve.py 코드 실행하기 (데이터 수집 및 분석)
      run: python fetch_cve.py

    - name: 5. 완성된 cve_data.json 자동 저장 및 깃허브에 올리기
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add cve_data.json
        git commit -m "Auto-update: NVD 취약점 수집 및 룰 기반 번역 적용" || echo "변경된 데이터가 없습니다."
        git push
